<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px 12px;
      margin: 0;
      background: #f9f9f9;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #222;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background: #aa0000;
    }
    #result {
      margin-top: 14px;
      padding: 10px;
      background: white;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      color: #222;
      min-height: 24px;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>📊 YouTube Duration Sum</h2>
  <button id="sumBtn">Sum all durations</button>
  <div id="result">Click the button 👆</div>
  <div class="footer">Only visible videos count</div>
  <script src="popup.js"></script>
</body>
</html>
